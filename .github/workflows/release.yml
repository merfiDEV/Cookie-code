name: "Release: Build & Publish"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            command: build:win
          - os: macos-latest
            command: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Sync version from tag
        run: node scripts/sync-version.js
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Install dependencies
        run: npm ci

      # Кэш бинарников electron-builder (winCodeSign, nsis и пр.).
      # Защита от 503 при скачивании вспомогательных тулов с GitHub Releases.
      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && 'C:\\Users\\runneradmin\\AppData\\Local\\electron-builder\\Cache' || '~/Library/Caches/electron-builder' }}
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Build and Publish (stable)
        if: ${{ !contains(github.ref_name, '-beta') }}
        run: npm run ${{ matrix.command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only (beta)
        if: ${{ contains(github.ref_name, '-beta') }}
        run: npm run ${{ matrix.command }}:local

      - name: Upload beta artifacts
        if: ${{ contains(github.ref_name, '-beta') }}
        uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.zip
            dist/*.dmg
          retention-days: 30
